<svg xmlns="http://w3.org" viewBox="0 0 32 32">
  <style>
    :root {
      --main-color: #000000;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --main-color: #ffffff;
      }
    }
    .accent { fill: var(--main-color); }
    .stroke { stroke: var(--main-color); }
  </style>
  
  <!-- Outer CCNA Network Nodes -->
  <circle cx="16" cy="6" r="3" class="accent"/>
  <circle cx="26" cy="24" r="3" class="accent"/>
  <circle cx="6" cy="24" r="3" class="accent"/>
  
  <!-- Connection Lines (Network Topography) -->
  <line x1="16" y1="6" x2="26" y2="24" class="stroke" stroke-width="2"/>
  <line x1="26" y1="24" x2="6" y2="24" class="stroke" stroke-width="2"/>
  <line x1="6" y1="24" x2="16" y2="6" class="stroke" stroke-width="2"/>
  
  <!-- Inner Data Packet/Core Node -->
  <circle cx="16" cy="16" r="4" class="accent"/>
</svg>
