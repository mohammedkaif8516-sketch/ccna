<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <g fill="currentColor">
    <!-- Outer network nodes -->
    <circle cx="16" cy="6" r="3"/>
    <circle cx="26" cy="24" r="3"/>
    <circle cx="6" cy="24" r="3"/>
  </g>

  <g stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
    <!-- Connection lines (triangle topology) -->
    <line x1="16" y1="6" x2="26" y2="24"/>
    <line x1="26" y1="24" x2="6" y2="24"/>
    <line x1="6" y1="24" x2="16" y2="6"/>
  </g>

  <!-- Inner data packet / core node -->
  <circle cx="16" cy="16" r="4" fill="currentColor"/>
</svg>
